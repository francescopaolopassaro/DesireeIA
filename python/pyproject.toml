[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desireeia"
version = "0.0.5"
description = "Python wrapper for DesireeIA — local LLM inference engine"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Passaro Francesco Paolo"},
]
keywords = ["llm", "inference", "local", "gguf", "desireeia"]

[tool.setuptools.packages.find]
where = ["."]
include = ["desireeia*"]

# The native engine for every platform this build was produced for. The RID
# convention matches Build/runtimes/<RID>/native/ (win-x64, linux-x64,
# osx-x64, osx-arm64): python _native.py resolves the current machine's RID
# and loads desireeia/lib/<RID>/<libname>. Empty placeholders are shipped
# along as documented gaps, never faked.
[tool.setuptools.package-data]
"desireeia" = ["lib/*/*"]
